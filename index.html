    <!-- Start: App -->
    <section class="mt-[20px] pb-[200px] min-h-dvh">
      <div class="max-w-[1000px] mx-auto px-2">
        <!-- Tasks/Inputs -->
        <div id="tasks-container" x-data>
          <template x-for="task in $store.app.tasks" :key="task.id">
            <div
              class="relative mt-2 border-b-[4px] bg-[#230303]/40 text-white border-[#230303]/60 rounded-t-[8px] rounded-b-[8px] p-2.5 task-box"
              :data-id="task.id"
            >
              <textarea
                name="text"
                x-model="task.text"
                @input="$store.app.saveStateChanges()"
                placeholder="What's the current"
                class="w-full hide-scrollbar resize-none h-max outline-0 text-xl font-medium current-input"
              ></textarea>

              <div class="flex items-center justify-between">
                <div></div>

                <div class="flex items-center gap-x-8">
                  <button
                    class="w-7.5 h-7.5 bg-rose-400/20 hover:bg-rose-400/50 rounded-lg cursor-pointer flex items-center justify-center"
                    @click="$store.app.duplicateTask(task)"
                  >
                    <div x-data="iconComponent('copy', '')" x-html="icon"></div>
                  </button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>
    <!-- End: App -->
